program: test.py
method: grid
project: diffpure-hira-ranpac-diffhammer
name: imagenet-purification-diffpure-diffhammer-hira-ranpac
metric:
  name: robust_accuracy
  goal: maximize
parameters:
  purifier_name:
    value: diffpure
  attack_method:
    value: diffhammer
  output_dir:
    value: output
  num_validation_set:
    value: 1000
  batch_size:
    value: 2
  diffhammer_preset:
    value: default
  diffhammer_method:
    value: apgd
  diffhammer_n_iters:
    value: "30,30,30"
  diffhammer_loss_names:
    value: "CW,CE,DLR"
  diffhammer_n_restart:
    value: 3
  diffhammer_n_eval:
    value: 1
  diffhammer_n_eot:
    value: 1
  diffhammer_grad_mode:
    value: bpda
  diffhammer_em:
    value: false
  diffhammer_em_alpha:
    value: 0.5
  diffhammer_em_lam:
    value: 5.0
  diffhammer_em_steps:
    value: 5
  classifier:
    values:
      - vit_small
      - vit_tiny
      - swin_b
      - swin_s
  use_hira_adapter:
    values: [true]
  hira_expansion_dim:
    value: 16384
  use_ranpac_head:
    values: [true]
  hira_num_blocks:
    value: 4
  hira_batch_size:
    value: 128
  hira_num_workers:
    value: 4
  hira_epochs:
    value: 1
  hira_lr:
    value: 0.0001
  hira_weight_decay:
    value: 0.0001
  hira_seed:
    value: 0
  hira_cache_dir:
    value: pretrained/hira
  hira_dataset_root:
    value: ./dataset/imagenet
  hira_max_train_samples:
    value: -1
  hira_force_retrain:
    value: false
  adapt_noise_eps:
    value: 0.0
  adapt_noise_num:
    value: 1
  adapt_alpha:
    value: 1.0
  soft_threshold_alpha:
    value: 0.9
  soft_threshold_beta:
    value: 4.0
  soft_threshold_stat_eps:
    value: 1.0e-6
  soft_threshold_mode:
    value: away_from_mean
  stability_ridge_gamma:
    value: 0.0
  stability_ridge_stat_eps:
    value: 1.0e-6
  ranpac_rp_dim:
    value: 10000
  ranpac_selection_method:
    value: regression
  ranpac_lambda:
    value: 0.5
  ranpac_temp:
    value: 1.0
  ranpac_hardneg_topk:
    value: 0
  ranpac_hardneg_gamma:
    value: 0.0
  ranpac_batch_size:
    value: 64
  ranpac_num_workers:
    value: 4
  ranpac_seed:
    value: 0
  ranpac_cache_dir:
    value: pretrained/ranpac
  ranpac_dataset_root:
    value: ./dataset/imagenet
  guided_diffusion_pretrained_root:
    value: /home_fmg/maorong/python/DiffPure/pretrained
  guided_diffusion_use_fp16:
    value: true
  diffpure_diffusion_type:
    value: sde
  diffpure_sampling_method:
    value: ddpm
  diffpure_sample_step:
    value: 1
  diffpure_t:
    value: 150
  diffpure_rand_t:
    value: false
  diffpure_t_delta:
    value: 15
  diffpure_use_brownian:
    value: false
  device:
    value: "cuda:0"
  seed:
    value: 0
  use_wandb:
    value: true
  wandb_project:
    value: diffpure-hira-ranpac
  wandb_group:
    value: imagenet-purification-diffpure-diffhammer-hira-ranpac
  wandb_mode:
    value: online
  eps:
    values: [4]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
