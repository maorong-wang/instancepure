program: test.py
method: grid
project: mimicdiffusion-hira-ranpac-diffhammer
name: imagenet-purification-mimicdiffusion-diffhammer-hira-ranpac
metric:
  name: robust_accuracy
  goal: maximize
parameters:
  purifier_name:
    value: mimicdiffusion
  attack_method:
    value: diffhammer
  output_dir:
    value: output
  num_validation_set:
    value: 1000
  batch_size:
    value: 2
  diffhammer_preset:
    value: default
  diffhammer_method:
    value: apgd
  diffhammer_n_iters:
    value: "30,30,30"
  diffhammer_loss_names:
    value: "CW,CE,DLR"
  diffhammer_n_restart:
    value: 3
  diffhammer_n_eval:
    value: 1
  diffhammer_n_eot:
    value: 5
  diffhammer_grad_mode:
    value: bpda
  diffhammer_em:
    value: false
  diffhammer_em_alpha:
    value: 0.5
  diffhammer_em_lam:
    value: 5.0
  diffhammer_em_steps:
    value: 5
  classifier:
    values:
      - swin_b
  use_hira_adapter:
    values: [false]
  hira_expansion_dim:
    value: 16384
  use_ranpac_head:
    values: [false]
  hira_num_blocks:
    value: 4
  hira_batch_size:
    value: 128
  hira_num_workers:
    value: 4
  hira_epochs:
    value: 1
  hira_lr:
    value: 0.0001
  hira_weight_decay:
    value: 0.0001
  hira_seed:
    value: 0
  hira_cache_dir:
    value: pretrained/hira
  hira_dataset_root:
    value: ./dataset/imagenet
  hira_max_train_samples:
    value: -1
  hira_force_retrain:
    value: false
  adapt_noise_eps:
    value: 0.0
  adapt_noise_num:
    value: 1
  adapt_alpha:
    value: 1.0
  soft_threshold_alpha:
    value: 0.0
  soft_threshold_beta:
    value: 4.0
  soft_threshold_stat_eps:
    value: 1.0e-6
  soft_threshold_mode:
    values: ["away_from_mean", "two_pits"]

  hira_subspace_rank:
    value: 128
  hira_subspace_shrink:
    value: 0.5
  stability_ridge_gamma:
    value: 0.0
  stability_ridge_stat_eps:
    value: 1.0e-6
  ranpac_rp_dim:
    value: 10000
  ranpac_selection_method:
    value: regression
  ranpac_lambda:
    value: 0.5
  ranpac_temp:
    value: 1.0
  ranpac_hardneg_topk:
    value: 0
  ranpac_hardneg_gamma:
    value: 0.0
  ranpac_batch_size:
    value: 64
  ranpac_num_workers:
    value: 4
  ranpac_seed:
    value: 0
  ranpac_cache_dir:
    value: pretrained/ranpac
  ranpac_dataset_root:
    value: ./dataset/imagenet
  guided_diffusion_pretrained_root:
    value: /home_fmg/maorong/python/DiffPure/pretrained
  guided_diffusion_use_fp16:
    value: true
  mimicdiffusion_max_timesteps:
    value: "1000"
  mimicdiffusion_num_denoising_steps:
    value: "100"
  mimicdiffusion_sampling_method:
    value: ddpm
  mimicdiffusion_rho_scale:
    value: 3000.0
  mimicdiffusion_guidance_start_step:
    value: 20
  mimicdiffusion_guidance_end_step:
    value: 90
  mimicdiffusion_projection_scale:
    value: 4
  device:
    value: "cuda:0"
  seed:
    value: 0
  use_wandb:
    value: true
  wandb_project:
    value: mimicdiffusion-hira-ranpac
  wandb_group:
    value: imagenet-purification-mimicdiffusion-diffhammer-hira-ranpac
  wandb_mode:
    value: online
  eps:
    values: [4]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
