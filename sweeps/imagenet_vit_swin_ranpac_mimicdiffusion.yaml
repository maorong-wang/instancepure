program: test.py
method: grid
project: mimicdiffusion-hira-ranpac-purification
name: imagenet-purification-mimicdiffusion-hira-ranpac
metric:
  name: robust_accuracy
  goal: maximize
parameters:
  purifier_name:
    value: mimicdiffusion
  attack_method:
    value: diff_pgd
  output_dir:
    value: output
  num_validation_set:
    value: 1000
  classifier:
    values:
      - vit_base
  use_hira_adapter:
    values: [true]
  hira_expansion_dim:
    value: 16384
  use_ranpac_head:
    values: [true]
  hira_num_blocks:
    value: 4
  hira_batch_size:
    value: 128
  hira_num_workers:
    value: 4
  hira_epochs:
    value: 1
  hira_lr:
    value: 0.0001
  hira_weight_decay:
    value: 0.0001
  hira_seed:
    value: 0
  hira_cache_dir:
    value: pretrained/hira
  hira_dataset_root:
    value: ./dataset/imagenet
  hira_max_train_samples:
    value: -1
  hira_force_retrain:
    value: false
  adapt_noise_eps:
    value: 0.0
  adapt_noise_num:
    value: 1
  adapt_alpha:
    value: 1.0
  soft_threshold_alpha:
    value: 0.9
  soft_threshold_beta:
    value: 4.0
  soft_threshold_stat_eps:
    value: 1.0e-6
  soft_threshold_mode:
    value: away_from_mean
  stability_ridge_gamma:
    value: 0.0
  stability_ridge_stat_eps:
    value: 1.0e-6
  ranpac_rp_dim:
    value: 10000
  ranpac_selection_method:
    value: regression
  ranpac_lambda:
    value: 0.5
  ranpac_temp:
    value: 1.0
  ranpac_hardneg_topk:
    value: 0
  ranpac_hardneg_gamma:
    value: 0.0
  ranpac_batch_size:
    value: 64
  ranpac_num_workers:
    value: 4
  ranpac_seed:
    value: 0
  ranpac_cache_dir:
    value: pretrained/ranpac
  ranpac_dataset_root:
    value: ./dataset/imagenet
  guided_diffusion_pretrained_root:
    value: /home_fmg/maorong/python/DiffPure/pretrained
  guided_diffusion_use_fp16:
    value: true
  mimicdiffusion_max_timesteps:
    value: "1000"
  mimicdiffusion_num_denoising_steps:
    value: "100"
  mimicdiffusion_sampling_method:
    value: ddpm
  mimicdiffusion_rho_scale:
    value: 3000.0
  mimicdiffusion_guidance_start_step:
    value: 20
  mimicdiffusion_guidance_end_step:
    value: 90
  mimicdiffusion_projection_scale:
    value: 4
  device:
    value: "cuda:0"
  seed:
    value: 0
  use_wandb:
    value: true
  wandb_project:
    value: mimicdiffusion-hira-ranpac
  wandb_group:
    value: imagenet-purification-mimicdiffusion-hira-ranpac
  wandb_mode:
    value: online
  eps:
    values: [4]
  atk_iter:
    value: 30
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
