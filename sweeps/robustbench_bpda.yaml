program: eval_robustbench_ranpac.py
method: grid
project: robustbench-ranpac-bpda
name: robustbench-bpda-hira-ranpac-imagenet
metric:
  name: robust_acc
  goal: maximize
parameters:
  dataset:
    value: imagenet
  threat_model:
    value: Linf
  data_dir:
    value: ./dataset/imagenet
  model_dir:
    value: ./robustbench_models
  model_names:
    values:
      - Xu2024MIMIR_Swin-B
        #- Liu2023Comprehensive_Swin-L
        #- Liu2023Comprehensive_Swin-B
        #- Singh2023Revisiting_ViT-S-ConvStem
        #- RodriguezMunoz2024Characterizing_Swin-L
        #- RodriguezMunoz2024Characterizing_Swin-B
  use_hira:
    value: true
  use_ranpac:
    value: true
  attack_method:
    value: pgd
  bpda_mode:
    values:
      - meansparse_subspace
  eval_examples:
    value: 5000
  eval_split:
    value: test
  eval_batch_size:
    value: 64
  num_workers:
    value: 4
  eps:
    value: 0.0156862745
  pgd_steps:
    value: 40
  pgd_random_start:
    value: true
  hira_expansion_dim:
    value: 16384
  hira_num_blocks:
    value: 4
  hira_batch_size:
    value: 128
  hira_num_workers:
    value: 4
  hira_epochs:
    value: 1
  hira_lr:
    value: 0.0001
  hira_weight_decay:
    value: 0.0001
  hira_seed:
    value: 0
  hira_cache_dir:
    value: pretrained/hira_robustbench
  hira_dataset_root:
    value: ./dataset/imagenet
  hira_max_train_samples:
    value: -1
  hira_force_retrain:
    value: false
  adapt_noise_eps:
    value: 0
  adapt_noise_num:
    value: 1
  adapt_alpha:
    value: 1
  soft_threshold_alpha:
    value: 0.9
  soft_threshold_beta:
    value: 4.0
  soft_threshold_stat_eps:
    value: 1.0e-6
  soft_threshold_mode:
    value: away_from_mean
  hira_subspace_rank:
    value: 1024
  hira_subspace_shrink:
    value: 0.5
  stability_ridge_gamma:
    value: 0.0
  stability_ridge_stat_eps:
    value: 1.0e-6
  ranpac_rp_dim:
    value: 10000
  ranpac_lambda:
    value: 0.5
  ranpac_temp:
    value: 1
  ranpac_hardneg_topk:
    value: 0
  ranpac_hardneg_gamma:
    value: 0.0
  ranpac_fit_batch_size:
    value: 64
  ranpac_cache_dir:
    value: pretrained/ranpac_robustbench
  seed:
    value: 0
  device:
    value: cuda:0
  use_wandb:
    value: true
  wandb_project:
    value: robustbench-ranpac-bpda
  wandb_group:
    value: robustbench-bpda-hira-ranpac-imagenet
  wandb_mode:
    value: online
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
